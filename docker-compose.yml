services:
  postgres:
    image: postgres:16-alpine
    container_name: forja_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: forja
      POSTGRES_PASSWORD: forja_dev_2026
      POSTGRES_DB: forja
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forja"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forja_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: forja_minio
    restart: unless-stopped
    ports:
      - "9100:9000"   # API S3
      - "9101:9001"   # Console web (http://localhost:9001)
    environment:
      MINIO_ROOT_USER: forja_admin
      MINIO_ROOT_PASSWORD: forja_minio_dev_2026
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio_setup:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: forja_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 forja_admin forja_minio_dev_2026;
      mc mb --ignore-existing local/forja-desenhos;
      mc mb --ignore-existing local/forja-fotos;
      mc anonymous set download local/forja-desenhos;
      mc anonymous set download local/forja-fotos;
      echo 'Buckets criados';
      exit 0;
      "

  evolution_api:
    image: atendai/evolution-api:latest
    container_name: forja_evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=forja_evolution_dev_key_change_in_prod
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_URI=postgresql://forja:forja_dev_2026@postgres:5432/evolution
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - full

volumes:
  postgres_data:
  redis_data:
  minio_data:
