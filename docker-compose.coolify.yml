services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forja_dev_2026}
      POSTGRES_DB: ${POSTGRES_DB:-forja}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forja} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-forja_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-forja_minio_dev_2026}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  minio_setup:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-forja_admin} ${MINIO_SECRET_KEY:-forja_minio_dev_2026};
      mc mb --ignore-existing local/${MINIO_BUCKET_DESENHOS:-forja-desenhos};
      mc mb --ignore-existing local/${MINIO_BUCKET_FOTOS:-forja-fotos};
      mc anonymous set download local/${MINIO_BUCKET_DESENHOS:-forja-desenhos};
      mc anonymous set download local/${MINIO_BUCKET_FOTOS:-forja-fotos};
      echo 'Buckets criados'; exit 0;
      "

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://forja:forja_dev_2026@postgres:5432/forja}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-forja_dev_secret_change_in_prod_seriously}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-forja_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-forja_minio_dev_2026}
      MINIO_BUCKET_DESENHOS: ${MINIO_BUCKET_DESENHOS:-forja-desenhos}
      MINIO_BUCKET_FOTOS: ${MINIO_BUCKET_FOTOS:-forja-fotos}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9100}
    depends_on:
      - postgres
      - redis
      - minio

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""
        VITE_WS_URL: ""
    restart: unless-stopped
    environment:
      SERVICE_FQDN_FRONTEND_80: ${SERVICE_FQDN_FRONTEND:-}
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
