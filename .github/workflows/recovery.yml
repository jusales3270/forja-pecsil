name: Database recovery
on:
  pull_request:
    branches: [main, fix/recovery-intranet]
  push:
    branches: [fix/recovery-intranet, fix/avisos-por-estacao]
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forja
          POSTGRES_PASSWORD: recovery_ci_only
          POSTGRES_DB: forja_recovery_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://forja:recovery_ci_only@localhost:5432/forja_recovery_test
      NODE_ENV: test
      JWT_SECRET: recovery_ci_only_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm --filter @forja/shared build
      - run: pnpm --filter @forja/backend build
      - run: pnpm --filter @forja/frontend build
      - name: Parser and safeguards
        run: node --test backend/test/recovery.unit.test.mjs
      - name: Station notice panel visibility
        working-directory: frontend
        run: node --import ../backend/node_modules/tsx/dist/loader.mjs --test test/avisos.test.tsx
      - name: Restore, login and foundry alerts on PostgreSQL
        working-directory: backend
        env:
          RUN_RECOVERY_INTEGRATION: '1'
        run: node --import tsx --test test/recovery.integration.test.ts test/avisos.integration.test.ts
